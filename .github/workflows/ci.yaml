name: CI do bot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt
            requirements/web.txt
      - name: Garantir que .env não está versionado
        run: test -z "$(git ls-files .env)"
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements/dev.txt
      - name: Lint de erros críticos
        run: python -m ruff check --select E9,F821,F822,F823 src/contraponto tests
      - name: Testes sem chamadas externas
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker - build e smoke
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configuração fictícia somente para validar Compose
        run: |
          printf '%s\n' 'TELEGRAM_BOT_TOKEN=123456:ci-fake-token' 'OPENAI_API_KEY=' 'GOOGLE_FACT_CHECK_KEY=' 'TAVILY_API_KEY=' > .env
          docker compose config --quiet
          docker compose -f compose.web.yaml config --quiet
      - name: Construir imagem do bot
        run: docker compose build
      - name: Testar imagem, modelo montado, fallback, polling e SIGTERM sem rede
        run: python tests/docker/check_image.py
      - name: Construir imagem web
        run: docker compose -f compose.web.yaml build
      - name: Testar HTTP, sala, fallback e SIGTERM sem rede externa
        run: >-
          docker run --rm --network none
          --mount type=bind,source=${{ github.workspace }}/tests/docker/web_probe.py,target=/web_probe.py,readonly
          contraponto-web:local python /web_probe.py
